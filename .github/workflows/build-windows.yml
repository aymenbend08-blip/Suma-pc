name: Build Windows

# Cross-compiling a working NSIS installer from Linux is unreliable, so the
# real release artifact is always built on an actual windows-latest runner.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Separate job/runner from `build` on purpose: `build`'s `npm install`
    # triggers the postinstall electron-builder rebuild of better-sqlite3
    # for Electron's ABI, which a plain Node process (vitest) can't load.
    # --ignore-scripts here skips that rebuild, leaving better-sqlite3 at
    # its normal Node-ABI prebuild so the tests (which run main/db.ts
    # directly, no Electron involved) can require() it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run test

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No package-lock.json is committed (npm's lockfile format churns
      # heavily on every dependency bump and isn't worth vendoring for a
      # project this size yet) — so this installs from package.json's
      # ranges rather than `npm ci`, which requires a lockfile to exist.
      - run: npm install

      - name: Typecheck
        run: npm run typecheck

      # These are the publishable (anon) URL/key — the same ones SUMA Web
      # already ships inside its own public browser bundle, protected
      # entirely by Supabase RLS, not by keeping them out of source
      # control. Safe to commit here for the same reason; no repo secrets
      # needed for this build to be fully functional out of the box.
      - name: Build (Vite + Electron main/preload/renderer)
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://tlpcuabifqulfdvrvmlm.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRscGN1YWJpZnF1bGZkdnJ2bWxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMzEzNTksImV4cCI6MjEwNDkwNzM1OX0.4Q01dYuY93hko2JgtVf6YwilljzrGo_I6lvhYLXdT1Y

      - name: Package Windows installer
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: suma-desktop-windows
          path: release/**/*.exe
          if-no-files-found: error
